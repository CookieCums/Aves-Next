name: Build APK

# APK build pipeline; release APKs are uploaded as workflow artifacts.

on:
  workflow_dispatch:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository and Flutter submodule
        uses: actions/checkout@v5
        with:
          ref: develop
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Flutter wrapper
        run: ./flutterw --version

      - name: Get Flutter packages
        run: ./flutterw pub get

      - name: Generate app localizations
        run: ./flutterw gen-l10n

      - name: Prepare APK output directories
        run: mkdir -p outputs/libre outputs/izzy

      - name: Build Libre release APKs
        run: |
          scripts/apply_flavor_libre.sh
          ./flutterw build apk -t lib/main_libre.dart --flavor libre --split-per-abi
          cp build/app/outputs/flutter-apk/*-libre-release.apk outputs/libre/

      - name: Build Izzy release APKs
        run: |
          scripts/apply_flavor_izzy.sh
          ./flutterw build apk -t lib/main_izzy.dart --flavor izzy --split-per-abi
          cp build/app/outputs/flutter-apk/*-izzy-release.apk outputs/izzy/

      - name: Verify collected APKs
        run: |
          find outputs -type f -name '*.apk' -print
          test "$(find outputs/libre -type f -name '*.apk' | wc -l)" -eq 3
          test "$(find outputs/izzy -type f -name '*.apk' | wc -l)" -eq 3
          test "$(find outputs -type f -name '*.apk' | wc -l)" -eq 6

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aves-next-apks-${{ github.sha }}
          path: outputs/**/*.apk
          if-no-files-found: error
          retention-days: 14
