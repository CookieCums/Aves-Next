name: Release on tag

on:
  push:
    tags:
      - v*

permissions: read-all

jobs:
  release_github:
    name: GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Set up JDK for Android Gradle plugin
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Checkout repository and Flutter submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Prepare Flutter version metadata
        run: git -C .flutter tag -f 3.47.0-0.3.pre HEAD

      - name: Get Flutter packages
        run: .flutter/bin/flutter pub get

      - name: Generate app localizations
        run: .flutter/bin/flutter gen-l10n

      - name: Build signed artifacts
        run: |
          echo "${{ secrets.KEY_JKS }}" > release.keystore.asc
          gpg -d --passphrase "${{ secrets.KEY_JKS_PASSPHRASE }}" --batch release.keystore.asc > "$AVES_STORE_FILE"
          rm release.keystore.asc
          mkdir -p outputs

          scripts/apply_flavor_izzy.sh
          .flutter/bin/flutter build apk -t lib/main_izzy.dart --flavor izzy --split-per-abi
          cp build/app/outputs/flutter-apk/*-izzy-release.apk outputs/

          scripts/apply_flavor_libre.sh
          .flutter/bin/flutter build apk -t lib/main_libre.dart --flavor libre --split-per-abi
          cp build/app/outputs/flutter-apk/*-libre-release.apk outputs/

          printf '%s\n' outputs/*.apk | sort > outputs/files.txt
          sha256sum outputs/*.apk > outputs/SHA256SUMS.txt
          rm "$AVES_STORE_FILE"
        env:
          AVES_STORE_FILE: ${{ github.workspace }}/key.jks
          AVES_STORE_PASSWORD: ${{ secrets.AVES_STORE_PASSWORD }}
          AVES_KEY_ALIAS: ${{ secrets.AVES_KEY_ALIAS }}
          AVES_KEY_PASSWORD: ${{ secrets.AVES_KEY_PASSWORD }}

      - name: Verify release APKs
        run: |
          test "$(find outputs -maxdepth 1 -type f -name '*-izzy-release.apk' | wc -l)" -eq 3
          test "$(find outputs -maxdepth 1 -type f -name '*-libre-release.apk' | wc -l)" -eq 3
          test "$(find outputs -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 6
          test -s outputs/SHA256SUMS.txt

      - name: Generate artifact attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: 'outputs/*.apk'

      - name: Create GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifacts: "outputs/*.apk,outputs/SHA256SUMS.txt"
          body: "[Changelog](https://github.com/${{ github.repository }}/blob/develop/CHANGELOG.md#${{ github.ref_name }})"
          token: ${{ secrets.GITHUB_TOKEN }}
